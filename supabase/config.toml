# Supabase CLI config (lokale Entwicklung). Remote-Projekt: whfhjpneehvjvlyhuzpb
project_id = "whfhjpneehvjvlyhuzpb"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "tippety://"
additional_redirect_urls = ["tippety://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = false

# Sign in with Apple / Google: Secrets nur via env, nie committen.
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true
